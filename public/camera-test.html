<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#164e46">
    <meta name="app-version" content="development">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>解像度の検証 | 板書カメラ</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./camera-test.css">
    <script type="module" src="./camera-preview.js"></script>
  </head>
  <body>
    <main>
      <section id="camera-screen" class="screen" aria-label="カメラの解像度検証">
        <video id="camera" autoplay muted playsinline aria-label="背面カメラの映像"></video>
        <header class="overlay top">
          <h1>解像度の検証（Issue #3）</h1>
          <p id="resolution">映像：未取得</p>
          <p id="request">要求：背面カメラ・高解像度</p>
          <p class="version">版：<span data-app-version>開発版</span></p>
          <p class="version" data-update-status role="status"></p>
        </header>
        <div class="overlay bottom">
          <p id="status" role="status">「カメラを開始」を押し、カメラの使用を許可してください。</p>
          <p id="wake-status"></p>
          <div class="buttons">
            <button id="start" type="button">カメラを開始</button>
            <button id="capture" type="button" disabled>1コマを撮影</button>
            <button id="stop" type="button" disabled>停止</button>
          </div>
          <p class="note">撮った画像はこの画面で確認できます。画面を閉じると消えます。</p>
          <a href="./">ホームに戻る</a>
        </div>
      </section>
      <section id="image-screen" class="screen review" aria-label="撮影画像の確認" hidden>
        <header class="review-header">
          <h1>撮影画像の確認</h1>
          <p id="image-resolution"></p>
          <p class="version">版：<span data-app-version>開発版</span></p>
          <p class="version" data-update-status role="status"></p>
          <div class="buttons">
            <button id="actual-size" type="button" aria-pressed="false">等倍で確認</button>
            <button id="back" type="button">カメラに戻る</button>
          </div>
          <p>等倍では上下左右にスクロールして、文字を確認できます。</p>
        </header>
        <div id="image-area" class="image-area" tabindex="0" aria-label="撮影画像。等倍ではスクロールできます。">
          <canvas id="image" aria-label="カメラ映像から切り出した画像"></canvas>
        </div>
      </section>
    </main>
    <noscript>カメラの検証にはJavaScriptを有効にしてください。</noscript>
  </body>
</html>
